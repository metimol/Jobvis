[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jobvis"
version = "0.1.0"

dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "langchain[google-genai]==1.2.13",
    "langchain-google-genai==4.2.1"
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.2"
]

[tool.setuptools]
packages = ["ai", "const"]
py-modules = ["main"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN", "TD", "FIX002", "COM812", "PLR2004"]
